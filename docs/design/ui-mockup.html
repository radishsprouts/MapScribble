<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>MapScribble 画面モックアップ（GUIピクセル×2で表示）</title>
<style>
  /* 1 GUIピクセル = --s CSSピクセル。座標はすべて GUI ピクセルで書き、calc で拡大する */
  :root { --s: 2px; }
  body { margin: 0; padding: 16px; background: #1b1d20; color: #ddd; font-family: "Yu Gothic UI", "Meiryo", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 24px 0 6px; }
  p.note { font-size: 13px; color: #aaa; margin: 0 0 8px; max-width: 72em; }
  .wrap { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .screen { position: relative; overflow: hidden; outline: 1px solid #555;
    background: linear-gradient(135deg, #3f6b2f 0 30%, #2c5aa0 30% 45%, #d9d09c 45% 52%, #3f6b2f 52% 80%, #f2f2f2 80%); }
  .abs { position: absolute; box-sizing: border-box; }
  /* JourneyMap の既存要素（見本。位置は公式画像からの実測と API の説明による） */
  .jm { background: rgba(20,20,20,.70); border: 1px dashed #ff9e3d; }
  .jmlabel { font-size: calc(5 * var(--s)); color: #ffcf9e; padding: 1px; line-height: 1.1; }
  /* ツールの帯 */
  .band { background: rgba(16,20,24,.80); border: var(--s) solid rgba(255,255,255,.20); }
  .btn { background: rgba(255,255,255,.15); border: calc(1 * var(--s)) solid rgba(255,255,255,.45);
    color: #e6e6e6; display: flex; align-items: center; justify-content: center; font-size: calc(9 * var(--s)); line-height: 1; }
  .btn.sel { background: #2e7dd7; border-color: #fff; color: #fff; }
  .btn.dis { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.15); color: rgba(230,230,230,.35); }
  .sep { background: rgba(255,255,255,.25); }
  .sw { border: calc(1 * var(--s)) solid rgba(0,0,0,.6); }
  .sw.sel { outline: calc(1 * var(--s)) solid #fff; outline-offset: 0; border-color: #000; }
  .hint { color: #fff; font-size: calc(8 * var(--s)); line-height: 1; white-space: nowrap; text-shadow: var(--s) var(--s) 0 #3f3f3f; }
  .barw { background: #ff6e61; }
  /* 文字入力の画面 */
  .dim { background: rgba(0,0,0,.50); }
  .panel { background: rgba(32,36,40,.94); border: var(--s) solid #50565e; }
  .t { color: #fff; font-size: calc(8 * var(--s)); line-height: 1; white-space: nowrap; text-shadow: var(--s) var(--s) 0 #3f3f3f; }
  .t.sub { color: #a0a0a0; text-shadow: none; }
  .t.lab { color: #e0e0e0; text-shadow: none; }
  .edit { background: #000; border: var(--s) solid #a0a0a0; color: #e0e0e0; font-size: calc(8 * var(--s)); line-height: calc(9 * var(--s)); padding: calc(4 * var(--s)); white-space: pre; overflow: hidden; }
  .vbtn { background: #6f6f6f; border: var(--s) solid #000; box-shadow: inset var(--s) var(--s) 0 #aaa, inset calc(-1 * var(--s)) calc(-2 * var(--s)) 0 #555;
    color: #fff; font-size: calc(8 * var(--s)); display: flex; align-items: center; justify-content: center; text-shadow: var(--s) var(--s) 0 #3f3f3f; white-space: nowrap; }
  .vbtn.del { color: #ff5555; }
  .vbtn.focus { border-color: #fff; }
  .legend { font-size: 12px; color: #bbb; }
  .legend span { display: inline-block; width: 12px; height: 12px; vertical-align: middle; margin: 0 4px 0 12px; }
</style>
</head>
<body>
<h1>MapScribble 画面モックアップ</h1>
<p class="note">1 GUIピクセルを 2 CSSピクセルで表示。橙の破線は JourneyMap 自身の要素（置き場所の確認用の見本。右列の縦の長さは追加ボタンの数で変わる）。地図はただの背景色。アイコンは仮の文字で、実物は Dev-Art-Director が作る 16×16 の白い線画。</p>
<div class="legend"><span style="background:rgba(20,20,20,.7);outline:1px dashed #ff9e3d"></span>JourneyMap の要素<span style="background:rgba(16,20,24,.8)"></span>MapScribble のツールの帯</div>

<div id="host"></div>

<script>
const COLORS = [
  ["赤","#FF6E61"],["橙","#FF9500"],["黄","#FFE600"],["黄緑","#7CFC00"],["水色","#32D2FF"],
  ["青","#5C9DFF"],["紫","#C584FF"],["桃","#FF6FD0"],["白","#FFFFFF"],["黒","#1A1A1A"]
];
const S = v => `calc(${v} * var(--s))`;
function el(parent, cls, x, y, w, h, html, style) {
  const d = document.createElement("div");
  d.className = "abs " + cls;
  d.style.left = S(x); d.style.top = S(y);
  if (w != null) d.style.width = S(w);
  if (h != null) d.style.height = S(h);
  if (html != null) d.innerHTML = html;
  if (style) Object.assign(d.style, style);
  parent.appendChild(d); return d;
}
/* JourneyMap の要素（GUIピクセル）。公式画像 full-screen.png(1919x1057, GUI倍率2相当)の実測を元にした近似 */
function jmChrome(sc, W, H, showKeys) {
  el(sc, "jm jmlabel", 2, 2, 20, 20, "JM");
  const tw = Math.min(260, W - 60);
  el(sc, "jm jmlabel", (W - tw) / 2, 2, tw, 20, "JM 上部ツールバー（地図の種類・生き物・グリッド）");
  el(sc, "jm jmlabel", (W - 200) / 2, 24, 200, 10, "座標・バイオームの表示行");
  el(sc, "jm jmlabel", W - 22, 2, 20, 20, "×");
  el(sc, "jm jmlabel", 2, H / 2 - 42, 20, 84, "左列<br>検索<br>追従<br>拡大<br>縮小");
  el(sc, "jm jmlabel", W - 22, H / 2 - 52, 20, 104, "右列<br>(追加<br>ボタン)<br><b>手書き</b>");
  const bw = Math.min(220, W - 60);
  el(sc, "jm jmlabel", (W - bw) / 2, H - 22, bw, 20, "JM 下部ツールバー");
  el(sc, "jm jmlabel", (W - 180) / 2, H - 34, 180, 10, "地域・座標の表示行");
  if (showKeys) el(sc, "jm jmlabel", W - 230, H - 125, 228, 100, "キー一覧（Keys をオンにした時）");
}
/* ツールの帯: 原点 (28,44)、208×57 */
function band(sc, opt) {
  const b = el(sc, "band", 28, 44, 208, 57);
  const tools = [["囲","囲み"],["線","線"],["字","文字"],["消","消しゴム"],["選","編集"]];
  tools.forEach((t, i) => el(b, "btn" + (i === opt.tool ? " sel" : ""), 3 + i * 22, 3, 20, 20, t[0]));
  el(b, "sep", 114, 5, 1, 16);
  el(b, "btn" + (opt.undo ? "" : " dis"), 118, 3, 20, 20, "↶");
  el(b, "btn" + (opt.redo ? "" : " dis"), 140, 3, 20, 20, "↷");
  el(b, "sep", 171, 5, 1, 16);
  el(b, "btn", 183, 3, 20, 20, opt.hidden ? "◌" : "◉");
  [1, 2, 3].forEach((t, i) => {
    const w = el(b, "btn" + (i === opt.width ? " sel" : ""), 3 + i * 22, 26, 20, 14, "");
    el(w, "barw", 4 - 1, (12 - t) / 2, 12, t, null, { background: COLORS[opt.color][1] });
  });
  el(b, "sep", 70, 27, 1, 12);
  COLORS.forEach((c, i) => el(b, "sw" + (i === opt.color ? " sel" : ""), 74 + i * 13, 27, 12, 12, "", { background: c[1] }));
  el(b, "hint", 3, 44, 200, 9, opt.hint, opt.hintColor ? { color: opt.hintColor } : null);
}
/* 文字入力の画面: 幅240、中央 */
function dialog(sc, W, H, kind) {
  el(sc, "dim", 0, 0, W, H);
  const small = H < 260;
  const lines = small ? 3 : 5;
  const eh = lines * 9 + 11;
  const rows = kind === "enclose" ? 2 : 1;
  const ph = 8 + 9 + 6 + 9 + 3 + eh + 3 + 9 + 7 + 9 + 3 + 16 + 8 + rows * 20 + (rows - 1) * 4 + 10 + 20 + 8;
  const px = (W - 240) / 2, py = Math.max(4, Math.round((H - ph) / 2));
  const p = el(sc, "panel", px, py, 240, ph);
  let y = 7;
  const title = kind === "enclose" ? "囲みのメモ" : kind === "edit" ? "線のメモを編集" : "線のメモ";
  el(p, "t", 0, y, 236, 9, title, { textAlign: "center" }); y += 15;
  el(p, "t lab", 7, y, 120, 9, "文字"); y += 12;
  el(p, "edit", 7, y, 222, eh, kind === "edit" ? "村への道\n夜は危ない" : "鉄の採掘場\n（入口は北側）"); y += eh + 3;
  el(p, "t sub", 7, y, 160, 9, "Ctrl+Enter で確定 / Esc で取り消し");
  el(p, "t sub", 229 - 40, y, 40, 9, kind === "edit" ? "9/200" : "12/200", { textAlign: "right" }); y += 16;
  el(p, "t lab", 7, y, 120, 9, "色：赤"); y += 12;
  COLORS.forEach((c, i) => el(p, "sw" + (i === 0 ? " sel" : ""), 7 + i * 18, y, 16, 16, "", { background: c[1] })); y += 24;
  if (kind === "enclose") {
    el(p, "vbtn", 7, y, 109, 20, "塗り: ふつう");
    el(p, "vbtn", 120, y, 109, 20, "文字の大きさ: 中"); y += 24;
    el(p, "vbtn", 7, y, 109, 20, "ミニマップ: 表示"); y += 30;
  } else {
    el(p, "vbtn", 7, y, 109, 20, "文字の大きさ: 中");
    el(p, "vbtn", 120, y, 109, 20, "ミニマップ: 表示"); y += 30;
  }
  if (kind === "edit") el(p, "vbtn del", 7, y, 60, 20, "削除");
  el(p, "vbtn focus", 229 - 144, y, 70, 20, "確定");
  el(p, "vbtn", 229 - 70, y, 70, 20, "キャンセル");
}
function screen(title, W, H, fn, scale) {
  const host = document.getElementById("host");
  const box = document.createElement("div");
  const h = document.createElement("h2"); h.textContent = `${title}（GUI ${W}×${H}）`; box.appendChild(h);
  const sc = document.createElement("div"); sc.className = "screen";
  if (scale) sc.style.setProperty("--s", scale + "px");
  sc.style.width = `calc(${W} * var(--s))`; sc.style.height = `calc(${H} * var(--s))`;
  box.appendChild(sc); host.appendChild(box); fn(sc, W, H); return sc;
}
const host = document.getElementById("host");
const row = (t) => { const h = document.createElement("h2"); h.style.fontSize = "17px"; h.textContent = t; host.appendChild(h); };
row("A. 手書きモード中の全画面マップ（ツールの帯）");
screen("A1 最小の画面（854×480 を倍率2、または倍率を最大にした時）", 320, 240, (sc, W, H) => {
  jmChrome(sc, W, H, false);
  band(sc, { tool: 0, width: 1, color: 0, undo: false, redo: false, hint: "囲み：ドラッグして範囲を囲む" });
});
screen("A2 広い画面（1920×1080 を倍率2）・キー一覧あり", 960, 540, (sc, W, H) => {
  jmChrome(sc, W, H, true);
  band(sc, { tool: 3, width: 1, color: 5, undo: true, redo: true, hint: "メモを消しました（Ctrl+Z で戻せます）" });
}, 1);
screen("A3 メモを隠している時（最小の画面）", 320, 240, (sc, W, H) => {
  jmChrome(sc, W, H, false);
  band(sc, { tool: 1, width: 2, color: 2, undo: true, redo: false, hidden: true, hint: "メモを隠しています（目のボタンで表示）", hintColor: "#FFE600" });
});
row("B. 文字入力・編集の画面");
screen("B1 囲みを描き終えた直後（最小の画面・3行）", 320, 240, (sc, W, H) => { jmChrome(sc, W, H, false); dialog(sc, W, H, "enclose"); });
screen("B2 線のメモを編集（広い画面・5行）", 960, 540, (sc, W, H) => { jmChrome(sc, W, H, true); dialog(sc, W, H, "edit"); }, 1);
screen("B3 線のメモ（GUI 427×300・5行）", 427, 300, (sc, W, H) => { jmChrome(sc, W, H, false); dialog(sc, W, H, "line"); });
</script>
</body>
</html>

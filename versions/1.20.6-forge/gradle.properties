forge_version=1.20.6-50.2.14
# jm_api_version は置かない: JourneyMap API 2.0 系（journeymap.api.v2）に 1.20.6 向けの配布が無い。
# 置かない構成では jm/ パッケージと compat/JmCompat.java をコンパイルから外す
# （JourneyMap との連携は map/jm の JourneyMapLegacyAdapter がリフレクションで担う）
# JourneyMap 本体（開発用クライアントへの組み込み用。Modrinth の version_number。配布が無い構成はこの行を置かない）
jm_version=1.20.6-5.10.0-forge

# Minecraft の対応範囲（Maven 形式。META-INF/mods.toml の versionRange へ差し込む）。
# この構成向けの jar が別のマイナー版で読み込まれないよう上限を置く
mc_version_range=[1.20.6,1.20.7)

# jar 直下の pack.mcmeta の "pack" に入れる版番号の項目（stonecutter.gradle.kts の generatePackMcmeta が差し込む）。
# Forge は MOD の jar をそのままリソースパックとして読み、pack.mcmeta が無いと「Missing metadata in pack」で
# 読み込みを飛ばす。値は Forge 自身の jar（forge-1.20.6-50.2.14-universal-srg.jar）の pack.mcmeta に合わせた
pack_mcmeta_fields="pack_format": 32

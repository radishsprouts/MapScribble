name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: 全 Minecraft 版のビルドと単体テスト
        run: ./gradlew buildAndCollect test --stacktrace

      # JourneyMap API はライセンス上 jar に同梱できない。クラスが混入していたら失敗させる
      - name: JourneyMap API のクラスが jar に入っていないことを確かめる
        run: |
          shopt -s nullglob
          jars=(build/libs/*/*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "::error::build/libs に jar がありません"
            exit 1
          fi
          status=0
          for jar in "${jars[@]}"; do
            if unzip -Z1 "$jar" | grep -E '^(journeymap/api/|info/journeymap/)'; then
              echo "::error::$jar に JourneyMap API のクラスが含まれています"
              status=1
            else
              echo "OK: $jar に JourneyMap API のクラスは含まれていません"
            fi
          done
          exit $status

      - uses: actions/upload-artifact@v5
        with:
          name: mapscribble-jars
          path: build/libs/*/*.jar
          if-no-files-found: error

  gametest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["26.1.2", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: 仮想ディスプレイを入れる
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libegl-mesa0

      - name: クライアントゲームテストを実行する (${{ matrix.minecraft }})
        env:
          # 26.3 の SDL ウィンドウは Xvfb 上で GLX ビジュアルを見つけられない。EGL なら動く
          SDL_VIDEO_FORCE_EGL: "1"
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :${{ matrix.minecraft }}:runClientGameTest --stacktrace

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: gametest-${{ matrix.minecraft }}
          path: |
            run/screenshots/
            run/logs/latest.log
          if-no-files-found: ignore
